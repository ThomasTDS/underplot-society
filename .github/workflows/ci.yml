name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: underplot
          POSTGRES_USER: underplot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U underplot -d underplot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Used by the statement timeout test, which runs against real PostgreSQL.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: underplot
      DB_PASSWORD: ci-only-password
      DB_TEST_PGSQL_DATABASE: underplot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Every step runs even if an earlier one fails, so a single run reports all three audits.
      # Only high and critical advisories fail the job.
      - name: Backend (Composer)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: composer audit --locked --no-interaction --ignore-severity=low --ignore-severity=medium

      - name: Frontend (npm)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: End-to-end tests (npm)
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create secrets for this run only
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
          } > .env

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser and API tests
        working-directory: e2e
        run: npm test

      - name: Database-down tests
        working-directory: e2e
        run: npm run test:db-down
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-db-down

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-db-down/
            e2e/test-results/
          retention-days: 14
