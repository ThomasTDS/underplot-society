name: Code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new rules and advisories are checked even without new commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # PHP is not supported by CodeQL; it is covered by the Semgrep job below.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep (PHP)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Semgrep Community Edition with the public PHP rules. No account or token is used.
      - name: Scan the backend
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/src" --workdir /src \
            semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af \
            semgrep scan --config p/php --metrics=off \
            --exclude backend/vendor \
            --sarif-output=semgrep.sarif backend

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php
