version: 2

# Version updates are grouped and wait 14 days after a release, so a compromised or broken
# release has time to be caught upstream. Security updates are not delayed.
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by the frontend lint) does not support TypeScript 7 yet.
      # Remove once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
    ignore:
      # CI tests the backend on PHP 8.4, so the image stays on 8.4 patch releases.
      # Moving to a new PHP version is a deliberate change to both, not an automatic bump.
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directories: [/, /deploy/tunnel]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
