version: 2

# Version updates are grouped and wait 14 days after a release, so a compromised or broken
# release has time to be caught upstream. Security updates are not delayed.
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
